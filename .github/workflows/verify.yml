name: Research verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      STUDY_RESERVE_RAM_GIB: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Synthetic regression checks
        run: python -m unittest discover -s tests -v
      - name: Verify publication artifacts
        run: python audit.py --verify-files
      - name: Generate from the delivered checkpoint
        run: python generate_profiles.py --run runs/study_confirmation_compact_local_hires_prior_matching_seed17_3600s --count 1 --seed 104 --output exports/ci_smoke.npy
